[tox]
envlist = py310, py311, py312, py313, py314, lint, mypy
skip_missing_interpreters = True

[pytest]
asyncio_default_fixture_loop_scope = function

[gh-actions]
python =
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313, lint, mypy
  3.14: py314

[testenv]
commands =
  pytest --timeout=30 --cov=renogyapi --cov-report=xml {posargs}
deps =
  -rrequirements_test.txt

[testenv:lint]
basepython = python3
ignore_errors = True
commands =
  ruff check .
  ruff format --check .
deps =
  -rrequirements_lint.txt

[testenv:mypy]
basepython = python3
ignore_errors = True
commands =
  mypy renogyapi
deps =
  -rrequirements_lint.txt